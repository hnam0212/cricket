[package]
name = "cricket-bridge"
description = "WebSocket bridge between the Cricket app and the Chrome extension"
version.workspace = true
edition.workspace = true
repository.workspace = true

[dependencies]
cricket-core.workspace = true
getrandom = "0.4.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tungstenite = { version = "0.30.0", default-features = false, features = ["handshake"] }
