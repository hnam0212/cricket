[package]
name = "cricket-audio-win"
description = "Windows implementation of the Cricket audio traits (WASAPI + SMTC)"
version.workspace = true
edition.workspace = true
repository.workspace = true

[dependencies]
cricket-core.workspace = true

# Same version Tauri pulls in, so the workspace builds the crate only once.
[target.'cfg(windows)'.dependencies]
windows-core = "0.62"
windows = { version = "0.62", features = [
    "Foundation",
    "Foundation_Collections",
    "Media_Control",
    "Win32_Foundation",
    "Win32_Media_Audio",
    "Win32_Media_Audio_Endpoints",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Threading",
    "Win32_System_Variant",
] }
