[package]
name = "cricket"
description = "Keeps background music playing while the machine is quiet"
version.workspace = true
edition.workspace = true
repository.workspace = true

[lib]
name = "cricket_app"

[build-dependencies]
tauri-build = { version = "2.7.1", features = [] }

[dependencies]
cricket-core.workspace = true
cricket-audio-win.workspace = true
serde = { version = "1", features = ["derive"] }
tauri = { version = "2.12.1", features = ["tray-icon"] }
